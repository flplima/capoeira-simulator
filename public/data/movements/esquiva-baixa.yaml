id: esquiva-baixa
name: Esquiva baixa
aka: [esquiva de frente]
translation: esquiva rente ao chão
category: esquiva
side: right
summary: >-
  Uma ginga exagerada e bem baixa: a perna de trás desliza ainda mais para
  trás, o quadril desce e o peito se fecha sobre a coxa da frente, para que um
  golpe frontal ou circular passe por cima das costas. Uma mão toca o chão, a
  outra guarda o rosto.
steps:
  - Da ginga com o pé direito atrás, deslize o pé direito ainda mais para trás.
  - Dobre bem o joelho esquerdo (da frente) e desça o quadril.
  - Feche o peito sobre a coxa esquerda, mantendo os olhos no camarada.
  - Apoie a mão esquerda no chão à frente do pé esquerdo; o antebraço direito guarda o rosto.
  - Suba de volta para a base e continue gingando.
tips:
  - Não perca o camarada de vista — nunca abaixe a cabeça às cegas.
  - O joelho da frente fica sobre o pé da frente, sem cair para dentro.
  - Daqui, uma rasteira ou uma cabeçada são contra-ataques naturais.
en:
  translation: "dodge close to the floor"
  category: "dodge"
  summary: "An exaggerated, very low ginga: the back leg slides even further back, the hip drops and the chest closes over the front thigh, so a front or circular kick passes over your back. One hand touches the floor, the other guards the face."
  steps:
    - "From the ginga with the right foot back, slide the right foot even further back."
    - "Bend the left (front) knee deeply and drop the hip."
    - "Close the chest over the left thigh, keeping your eyes on your partner."
    - "Put the left hand on the floor in front of the left foot; the right forearm guards the face."
    - "Rise back to the base and keep gingando."
  tips:
    - "Never lose sight of your partner: never lower your head blindly."
    - "The front knee stays over the front foot, without collapsing inward."
    - "From here, a rasteira or a headbutt are natural counters."
sources:
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
