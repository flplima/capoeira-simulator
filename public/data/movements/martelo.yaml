id: martelo
name: Martelo
aka: [martelo em pé]
translation: martelo (a ferramenta)
category: ataque direto
side: right
summary: >-
  Um chute circular: o joelho de trás sobe pelo lado, o pé de apoio gira e a
  perna estala para acertar a cabeça ou as costelas com o peito do pé ou a
  canela, depois dobra de volta antes de retornar à base.
steps:
  - Da base com o pé direito atrás, suba o joelho direito para cima e para o lado.
  - Gire na ponta do pé esquerdo para que o quadril vire em direção ao alvo.
  - Incline o tronco para o lado oposto e estale a perna, batendo com o peito do pé (ponta esticada).
  - Dobre o joelho de volta na hora e devolva o pé à base.
tips:
  - É o giro do pé de apoio que deixa o quadril virar; não chute com o quadril de frente.
  - Mantenha o braço da guarda na frente do rosto enquanto o tronco se inclina.
  - A perna vai e volta pelo mesmo caminho — uma martelada rápida.
sources:
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
  - title: The 8 Training Sequences of Mestre Bimba — Papoeira
    url: https://papoeira.com/en/the-8-training-sequences-of-mestre-bimba/
loop: false
