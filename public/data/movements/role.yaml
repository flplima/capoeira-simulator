id: role
name: Rolê
translation: giro baixo pelo chão
category: esquiva
side: right
summary: >-
  O deslocamento de solo mais característico da capoeira: saindo da esquiva ou
  da cocorinha, o capoeirista apoia as mãos no chão, gira o quadril baixo sobre
  mãos e pés sem perder o parceiro de vista e levanta de volta na ginga em outro
  ponto da roda.
steps:
  - Da base, desça flexionando os joelhos e incline o tronco lateralmente buscando o solo com as mãos.
  - Apoie as duas mãos no chão à largura dos ombros e gire o quadril passando as pernas por trás.
  - Olhe por baixo do braço ou por cima do ombro durante todo o giro mantendo o contato visual.
  - Puxe os pés para perto das mãos, empurre o chão e suba de volta para a base da ginga.
tips:
  - Nunca dê as costas cegas ao camarada — a cabeça acompanha o parceiro por baixo da guarda.
  - O quadril passa baixo e leve, sustentado pelos braços firmes no chão.
en:
  translation: "low turn along the floor"
  category: "dodge"
  summary: "The most characteristic floor movement in capoeira: coming out of an esquiva or a cocorinha, the capoeirista puts the hands on the floor, turns the hip low over hands and feet without losing sight of the partner, and rises back into the ginga at another point of the roda."
  steps:
    - "From the base, drop by bending the knees and lean the torso sideways, reaching for the floor with your hands."
    - "Put both hands on the floor at shoulder width and turn the hip, passing the legs behind you."
    - "Look under your arm or over your shoulder through the whole turn to keep eye contact."
    - "Pull the feet in close to the hands, push off the floor and rise back to the ginga base."
  tips:
    - "Never turn your back blindly on your partner: the head follows them under the guard."
    - "The hip passes low and light, held up by firm arms on the floor."
sources:
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
