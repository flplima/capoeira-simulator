id: meia-lua-de-frente
name: Meia-lua de frente
aka: []
translation: meia-lua pela frente
category: ataque circular
side: right
summary: >-
  Um golpe circular saído da ginga: a perna de trás sobe esticada por fora,
  passa na frente do rosto do camarada de fora para dentro e volta para a
  base. Muito usado para medir a distância ou preparar outro ataque.
steps:
  - Na base com o pé direito atrás, passe o peso para a perna da frente (esquerda).
  - Suba a perna direita esticada, abrindo para o lado direito.
  - Passe a perna na altura da cabeça, de fora para dentro, girando o quadril junto.
  - Deixe a perna passar da linha do centro e depois desça de volta para a base.
  - Mantenha o braço de guarda na frente do rosto o tempo todo.
tips:
  - A perna fica esticada; a força vem do quadril, não de estalar o joelho.
  - Mantenha o joelho de apoio levemente dobrado e o pé de apoio inteiro no chão.
  - Volte direto para a ginga, para o próximo movimento já estar pronto.
en:
  translation: "half moon from the front"
  category: "circular attack"
  summary: "A circular kick out of the ginga: the back leg rises straight on the outside, sweeps across your partner's face from outside to inside and returns to the base. Often used to measure distance or set up another attack."
  steps:
    - "In the base with the right foot back, shift your weight to the front (left) leg."
    - "Raise the straight right leg, opening out to the right side."
    - "Sweep the leg at head height from outside to inside, turning the hip with it."
    - "Let the leg pass the center line, then bring it back down to the base."
    - "Keep the guard arm in front of your face the whole time."
  tips:
    - "The leg stays straight; the power comes from the hip, not from snapping the knee."
    - "Keep the standing knee slightly bent and the whole standing foot on the floor."
    - "Go straight back into the ginga so the next move is already ready."
