id: ponteira
name: Ponteira
aka: [ponta de pé]
translation: ponta (do pé)
category: ataque direto
side: right
summary: >-
  Um chute frontal rápido, que acerta com a planta do pé, logo abaixo dos
  dedos. A perna de trás recolhe o joelho, estala a canela na direção da
  barriga, do peito ou do rosto do camarada e volta na hora, antes que ele
  consiga segurar a perna.
steps:
  - Na base da ginga, com o pé direito atrás, passe o peso para a perna da frente (esquerda).
  - Suba o joelho direito alto na frente do corpo, pé esticado e dedos puxados para trás.
  - Estale a perna para a frente e acerte com a planta do pé; incline o tronco levemente para trás.
  - Recolha a canela na hora, de volta ao joelho dobrado — a volta é tão rápida quanto o chute.
  - Leve o pé direito de volta para a base e continue gingando.
tips:
  - Diferente da bênção, que empurra, a ponteira é um golpe seco — estala e recolhe.
  - Mantenha as mãos na guarda, protegendo o rosto, enquanto o joelho sobe.
  - Estique o pé e puxe os dedos para trás, para acertar com a planta, não com a ponta dos dedos.
en:
  translation: "the tip (of the foot)"
  category: "direct attack"
  summary: "A fast front kick that lands with the ball of the foot, just below the toes. The back leg draws the knee up, snaps the shin toward your partner's belly, chest or face and comes straight back, before they can catch the leg."
  steps:
    - "In the ginga base with the right foot back, shift your weight to the front (left) leg."
    - "Raise the right knee high in front of your body, foot pointed, toes pulled back."
    - "Snap the leg forward and hit with the ball of the foot; lean the torso slightly back."
    - "Pull the shin back to the bent knee at once: the return is as fast as the kick."
    - "Take the right foot back to the base and keep gingando."
  tips:
    - "Unlike the bênção, which pushes, the ponteira is a sharp strike: snap and retract."
    - "Keep your hands in the guard, protecting the face, while the knee rises."
    - "Point the foot and pull the toes back so you land with the ball of the foot, not the tips of the toes."
