id: joelhada
name: Joelhada
translation: golpe de joelho
category: ataque de proximidade
side: right
summary: >-
  Golpe de joelho para o jogo de perto: o joelho da perna de trás sobe para a
  frente, no corpo ou no rosto do camarada que entra baixo — depois de uma
  cabeçada, de uma esquiva baixa ou de uma entrada descuidada — enquanto os
  braços protegem a cabeça.
steps:
  - Na base da ginga, com o pé direito atrás, encurte a distância com um passinho à frente.
  - Leve o joelho direito para cima e para a frente, pé esticado, o quadril empurrando por trás do joelho.
  - Suba os dois antebraços na frente do rosto — na quinta sequência de Bimba os braços cruzam por cima da cabeça do camarada.
  - No impacto, suba um pouco no pé de apoio.
  - Desça a perna e volte com um passo para a base.
tips:
  - Use só de perto; de longe ela deixa você aberto, apoiado numa perna só.
  - A força vem do quadril indo para a frente, não de levantar a perna.
  - Mantenha o joelho de apoio solto, para absorver um empurrão.
sources:
  - title: The 8 training sequences of Mestre Bimba — Papoeira
    url: https://papoeira.com/en/the-8-training-sequences-of-mestre-bimba/
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
