id: queixada
name: Queixada
aka: []
translation: golpe no queixo
category: ataque circular
side: right
summary: >-
  Um golpe circular que é o inverso da meia-lua de frente: depois de um passo
  à frente que gira o quadril, a perna de trás sobe cruzando o corpo e passa
  de dentro para fora, acertando o queixo ou a bochecha com a lateral externa
  do pé.
steps:
  - Na base com o pé direito atrás, dê um passo à frente com o pé esquerdo virando a ponta para fora, girando o quadril para a esquerda.
  - Suba a perna direita pela frente do corpo, cruzando a linha do centro.
  - Passe a perna para fora na altura da cabeça, de dentro para fora, enquanto o quadril volta.
  - Deixe a perna descer do lado direito e volte para a base.
tips:
  - O passo à frente gera o giro; a perna é solta, não forçada.
  - Acerte com a lateral externa do pé e mantenha o joelho quase esticado no topo.
  - Mantenha a guarda alta e olhe para o camarada por cima do ombro, não para o chão.
en:
  translation: "blow to the chin"
  category: "circular attack"
  summary: "A circular kick that is the reverse of the meia-lua de frente: after a step forward that turns the hip, the back leg rises across the body and sweeps from inside to outside, hitting the chin or cheek with the outer edge of the foot."
  steps:
    - "In the base with the right foot back, step forward with the left foot, turning the toes out and the hip to the left."
    - "Raise the right leg across the front of your body, crossing the center line."
    - "Sweep the leg outward at head height, from inside to outside, as the hip turns back."
    - "Let the leg come down on the right side and return to the base."
  tips:
    - "The step forward creates the turn; the leg is loose, not forced."
    - "Hit with the outer edge of the foot and keep the knee almost straight at the top."
    - "Keep your guard high and look at your partner over your shoulder, not at the floor."
