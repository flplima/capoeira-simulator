id: meia-lua-de-compasso
name: Meia-lua de compasso
aka: [rabo de arraia, compasso]
translation: meia-lua de compasso (a perna traça um círculo como um compasso de desenho)
category: ataque circular
side: right
summary: >-
  O golpe giratório de calcanhar mais característico da capoeira. As duas mãos
  vão ao chão, os olhos encontram o camarada por baixo do braço e a perna de
  trás varre um círculo largo na altura da cabeça enquanto o corpo gira sobre
  o pé da frente. Quem dá a força é o giro, não a perna.
steps:
  - Da ginga com o pé direito atrás, gire o pé esquerdo (da frente) para dentro e dobre o tronco para baixo.
  - Apoie as duas mãos no chão ao lado do pé esquerdo e olhe o camarada por baixo do braço direito.
  - Continue girando para a direita; levante a perna direita esticada, para o lado e para cima.
  - Varra a perna num círculo completo na altura da cabeça, batendo com o calcanhar.
  - Desça a perna atrás, levante o tronco e volte à ginga de frente para o camarada.
tips:
  - Olhe o camarada durante todo o giro — com as mãos no chão, os olhos ficam livres para acompanhá-lo.
  - A batida da mão no chão começa o giro; o calcanhar termina.
  - Na sexta sequência de Mestre Bimba é respondida com cocorinha — e o compasso responde com outro compasso.
en:
  translation: "half moon of the compass (the leg draws a circle like a drawing compass)"
  category: "circular attack"
  summary: "The most characteristic spinning heel kick in capoeira. Both hands go to the floor, your eyes find your partner under the arm, and the back leg sweeps a wide circle at head height as the body turns over the front foot. The turn gives the power, not the leg."
  steps:
    - "From the ginga with the right foot back, turn the left (front) foot inward and fold the torso down."
    - "Put both hands on the floor beside the left foot and look at your partner under the right arm."
    - "Keep turning to the right; raise the straight right leg, to the side and up."
    - "Sweep the leg in a full circle at head height, striking with the heel."
    - "Bring the leg down behind you, lift the torso and return to the ginga facing your partner."
  tips:
    - "Watch your partner through the whole turn: with your hands on the floor, your eyes are free to follow them."
    - "The hands hitting the floor start the turn; the heel finishes it."
    - "In Mestre Bimba's sixth sequence it is answered with a cocorinha, and the compasso answers with another compasso."
