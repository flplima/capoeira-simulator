id: cocorinha
name: Cocorinha
aka: [cócoras]
translation: agachadinha, de cócoras
category: esquiva
side: right
summary: >-
  A esquiva agachada básica da Capoeira Regional. O capoeirista desce reto
  sobre os pés chapados, fechando o corpo com os joelhos junto ao peito, um
  braço cobrindo a cabeça e a outra mão no chão para equilibrar.
steps:
  - Da ginga, traga os pés para a paralela, mais ou menos na largura do quadril.
  - Desça reto num agachamento profundo, mantendo os calcanhares no chão.
  - Traga os joelhos para junto do peito para fechar o corpo.
  - Cubra a cabeça e a lateral do tronco com o braço direito; apoie a mão esquerda espalmada no chão ao lado.
  - Suba de volta para a paralela e siga na ginga.
tips:
  - Mantenha os pés chapados — na ponta dos pés você é fácil de derrubar.
  - Nas sequências de Mestre Bimba, quase todo golpe é respondido primeiro com uma cocorinha.
  - A cocorinha era um dos três exercícios do exame de admissão de Bimba, junto com a queda de rins e a ponte.
en:
  translation: "little squat, squatting"
  category: "dodge"
  summary: "The basic squatting dodge of Capoeira Regional. The capoeirista drops straight down on flat feet, closing the body with the knees against the chest, one arm covering the head and the other hand on the floor for balance."
  steps:
    - "From the ginga, bring the feet to the parallel, about hip width apart."
    - "Drop straight into a deep squat, keeping your heels on the floor."
    - "Bring the knees up to your chest to close the body."
    - "Cover the head and the side of the torso with the right arm; put the left hand flat on the floor beside you."
    - "Rise back to the parallel and continue in the ginga."
  tips:
    - "Keep your feet flat: on your toes you are easy to knock over."
    - "In Mestre Bimba's sequences, almost every blow is answered first with a cocorinha."
    - "The cocorinha was one of the three exercises in Bimba's admission exam, along with the queda de rins and the ponte."
