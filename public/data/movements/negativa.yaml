id: negativa
name: Negativa
translation: negação, recusa
category: esquiva
side: right
summary: >-
  Uma esquiva baixa que leva o corpo quase ao chão: uma perna se dobra por
  baixo, a outra se estende rente ao solo, uma mão sustenta o peso e o outro
  braço protege o rosto. É também a porta de entrada para o rolê e para as
  rasteiras.
steps:
  - Da ginga, desça sobre a perna esquerda, dobrando-a por completo até o quadril chegar perto do chão.
  - Estenda a perna direita à frente, rente ao chão, com o calcanhar apoiado.
  - Apoie a mão direita no chão ao lado do quadril direito para sustentar o peso.
  - Incline o tronco baixo sobre a perna estendida e cubra o rosto com o antebraço esquerdo.
  - Empurre o chão com a mão, recolha a perna direita e suba para a base.
tips:
  - Fique baixo e fechado; não sente no chão — o quadril fica suspenso.
  - Mantenha os olhos no camarada; a negativa costuma ser seguida de um rolê ou de uma rasteira.
  - Nas sequências de Mestre Bimba, a negativa geralmente vem seguida de uma cabeçada.
sources:
