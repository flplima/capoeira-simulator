id: esquiva-lateral
name: Esquiva lateral
aka: [esquiva de lado]
translation: esquiva para o lado
category: esquiva
side: right
summary: >-
  Uma esquiva que tira o corpo para o lado, para fora do caminho do golpe, em
  vez de bloqueá-lo. Da base da ginga, o peso desce sobre a perna da frente
  dobrada, a perna de trás abre esticada para o lado, o tronco se inclina
  sobre o joelho dobrado e um braço guarda a cabeça.
steps:
  - Da ginga, na base com a perna direita atrás, desça de uma vez sobre a perna da frente.
  - Enquanto desce, a perna de trás abre esticada para o lado num passo baixo, rente ao chão, bem mais largo que a ginga.
  - Dobre bem o joelho esquerdo e deite o tronco para a esquerda, sobre ele, sem tirar os olhos do camarada.
  - Leve o antebraço direito por cima da cabeça para protegê-la e mantenha os olhos no camarada; a mão esquerda fica solta à frente do joelho.
  - Suba na perna da frente, traga a perna direita de volta para trás num passo baixo e siga na ginga.
tips:
  - Esquive para longe do golpe — se o chute vem pela sua esquerda, a esquiva é para a direita.
  - Desça o bastante para o golpe passar por cima, mas continue de pé, pronto para contra-atacar.
  - Na quarta sequência de Mestre Bimba a esquiva é feita sem colocar a mão no chão.
en:
  translation: "dodge to the side"
  category: "dodge"
  summary: "A dodge that takes the body out of the way of the blow to the side, instead of blocking it. From the ginga base, the weight drops onto the bent front leg, the back leg opens out straight to the side, the torso leans over the bent knee and one arm guards the head."
  steps:
    - "From the ginga, in the base with the right leg back, drop at once onto the front leg."
    - "As you drop, the back leg opens out straight to the side in a low step, close to the floor and much wider than the ginga."
    - "Bend the left knee deeply and lay the torso over it to the left, without taking your eyes off your partner."
    - "Bring the right forearm over your head to protect it and keep your eyes on your partner; the left hand hangs loose in front of the knee."
    - "Rise on the front leg, bring the right leg back in a low step and continue in the ginga."
  tips:
    - "Dodge away from the blow: if the kick comes from your left, dodge to the right."
    - "Go low enough for the blow to pass over you, but stay on your feet, ready to counter."
    - "In Mestre Bimba's fourth sequence the esquiva is done without putting a hand on the floor."
