id: passagem-de-negativa
name: Passagem de Negativa
translation: troca baixa de negativa pelo chão
category: esquiva
side: right
summary: >-
  Uma transição rasteira entre as duas negativas: o capoeirista desce na negativa
  de um lado, recolhe e troca a perna estendida passando rente ao chão para a
  negativa oposta antes de subir de volta à ginga, enganando a varredura ou
  preparando um contra-ataque baixo.
steps:
  - Da base, desça na negativa apoiando a mão direita no solo e estendendo a perna direita à frente.
  - "Apoie as duas mãos por um instante e troque rente ao chão — recolha a perna direita flexionada e estenda a esquerda."
  - Transfira o apoio para a mão esquerda enquanto o braço direito assume a guarda do rosto.
  - Recolha a perna estendida, empurre o solo e suba de volta para a base da ginga.
tips:
  - A troca acontece sem levantar o quadril — deslize baixo entre os dois lados.
  - Os braços de apoio e de guarda se invertem junto com as pernas.
en:
  translation: "low switch of the negativa along the floor"
  category: "dodge"
  summary: "A low transition between the two negativas: the capoeirista drops into the negativa on one side, draws in and switches the extended leg, passing close to the floor to the opposite negativa before rising back to the ginga, fooling a sweep or preparing a low counter."
  steps:
    - "From the base, drop into the negativa with the right hand on the floor and the right leg extended forward."
    - "Put both hands down for a moment and switch close to the floor: draw in the bent right leg and extend the left."
    - "Shift the support to the left hand as the right arm takes over guarding the face."
    - "Draw in the extended leg, push off the floor and rise back to the ginga base."
  tips:
    - "The switch happens without lifting the hip: slide low between the two sides."
    - "The support and guard arms swap along with the legs."
sources:
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
