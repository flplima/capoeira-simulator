id: troca-de-base
name: Troca de Base
translation: inversão rápida da perna de trás
category: esquiva
side: right
summary: >-
  Uma mudança rápida de guarda a partir da base da ginga: em vez de percorrer
  todo o ciclo passando devagar pela paralela, o capoeirista recolhe e troca os
  pés num salto curto e baixo, invertendo a perna de trás para quebrar o tempo
  e abrir um novo ângulo de saída.
steps:
  - Da base com o pé direito atrás, flexione os dois joelhos impulsionando levemente o quadril.
  - Recolha o pé direito à frente enquanto o pé esquerdo recua rente ao chão num salto curto.
  - Inverta os braços da guarda acompanhando a troca das pernas.
  - Aterrisse amortecendo na ponta do pé esquerdo atrás, na base oposta, e retorne quando quiser.
tips:
  - O salto é rasante e elástico — os pés mal saem do chão para não perder a base.
  - Troque os braços da guarda no mesmo instante em que os pés se cruzam.
  - Excelente para surpreender o parceiro saindo com um golpe do lado inesperado.
en:
  translation: "quick reversal of the back leg"
  category: "dodge"
  summary: "A quick change of guard from the ginga base: instead of going through the whole cycle and passing slowly through the parallel, the capoeirista draws in and switches the feet in a short, low hop, reversing the back leg to break the timing and open a new angle to exit."
  steps:
    - "From the base with the right foot back, bend both knees, driving the hip slightly forward."
    - "Draw the right foot forward as the left foot steps back close to the floor in a short hop."
    - "Switch the guard arms along with the legs."
    - "Land softly on the ball of the left foot behind you, in the opposite base, and return whenever you like."
  tips:
    - "The hop is low and springy: the feet barely leave the floor, so you do not lose your base."
    - "Switch the guard arms at the very moment the feet cross."
    - "Great for surprising your partner by coming out with a move from the unexpected side."
sources:
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
