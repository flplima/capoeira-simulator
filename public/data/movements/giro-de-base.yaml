id: giro-de-base
name: Giro de Base
translation: passo giratório de reposicionamento
category: esquiva
side: right
summary: >-
  Um giro completo em pé sobre o eixo da base que reposiciona o capoeirista na
  roda sem soltar o chute: serve como finta de preparação para armadas e meias-luas,
  ou para escapar de um ataque saindo pelas costas do movimento do camarada.
steps:
  - Da base com o pé direito atrás, transfira o peso para a perna esquerda da frente e inicie a rotação do tronco.
  - Gire sobre a bola do pé mantendo os joelhos semiflexionados e a guarda alta protegendo o rosto.
  - Passe pelos 180° olhando por cima do ombro para não perder o parceiro de vista.
  - Complete os 360° assentando novamente o pé direito atrás na base da ginga.
tips:
  - A cabeça é a última a sair e a primeira a chegar — busque o olhar do parceiro cedo no giro.
  - Mantenha o centro de gravidade baixo; girar com as pernas retas tira o equilíbrio.
en:
  translation: "turning step to reposition"
  category: "dodge"
  summary: "A full standing turn on the axis of the base that repositions the capoeirista in the roda without releasing a kick: it serves as a feint before armadas and meias-luas, or to escape an attack by leaving behind your partner's movement."
  steps:
    - "From the base with the right foot back, shift your weight to the left front leg and start rotating the torso."
    - "Turn on the ball of the foot, keeping the knees slightly bent and the guard high, protecting the face."
    - "Pass through 180° looking over your shoulder so you do not lose sight of your partner."
    - "Complete the 360°, setting the right foot back in the ginga base again."
  tips:
    - "The head is the last to leave and the first to arrive: find your partner's eyes early in the turn."
    - "Keep your center of gravity low; turning with straight legs throws you off balance."
sources:
  - title: List of capoeira techniques — Wikipedia
    url: https://en.wikipedia.org/wiki/List_of_capoeira_techniques
