id: bencao
name: Bênção
aka: [chapa de frente]
translation: bênção, benção (o gesto de abençoar)
category: ataque direto
side: right
summary: >-
  Um chute reto de empurrão no peito ou na barriga com toda a sola do pé. O
  joelho de trás sobe primeiro e depois o quadril leva o pé à frente para
  empurrar o camarada para longe, e não para estalar o golpe.
steps:
  - Da base com o pé direito atrás, suba o joelho direito à frente do corpo.
  - Puxe a ponta do pé para trás para que a sola e o calcanhar fiquem virados para a frente.
  - Leve o quadril à frente e estenda a perna, empurrando com a sola na altura do peito.
  - Incline o tronco levemente para trás para equilibrar e mantenha a guarda alta.
  - Recolha o joelho e devolva o pé à base.
tips:
  - É um empurrão, não um estalo — mire através do alvo com o quadril.
  - Mantenha o pé de apoio inteiro no chão e o joelho dele destravado.
  - Responde-se com uma esquiva, uma negativa ou, se o camarada estiver perto, uma cabeçada.
sources:
