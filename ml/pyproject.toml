[project]
name = "capoeira-ml"
version = "0.1.0"
description = "Physics-based ginga: pose estimation from video, retargeting, and a MuJoCo imitation policy trained with PPO"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco>=3.3",
  "mediapipe>=0.10.14",
  "opencv-python>=4.10",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "torch>=2.4",
  "gymnasium>=1.0",
  "pillow>=12.3.0",
  "pyyaml>=6.0.3",
  "mujoco-mjx>=3.15.0",
  "jax>=0.10.2",
  "optax>=0.2.8",
  "modal>=1.6.2",
]
